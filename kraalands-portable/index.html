<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kraalands OS</title><style>
:root{--g:#12382d;--g2:#1f5745;--cream:#f5f0e5;--gold:#b79155;--ink:#17221d;--muted:#6b756f;--line:#dcd8ce}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f7f6f1;color:var(--ink)}button,input,select{font:inherit}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#0d2b23,#12382d);color:white;padding:22px 16px;position:fixed;width:245px;height:100vh}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:.1em}.sub{font-size:11px;color:#d8c9a9;margin-top:4px}.nav{margin-top:28px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#d7e2dc;padding:11px 13px;border-radius:10px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.active{background:#1e5a47;color:#fff}.foot{position:absolute;bottom:22px;font-size:11px;color:#9eb1a9;line-height:1.5}.main{grid-column:2}.top{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.top input{width:360px;padding:10px 14px;border:1px solid var(--line);border-radius:10px}.content{padding:28px;max-width:1500px}.title{font-size:28px;font-weight:700}.desc{color:var(--muted);margin:6px 0 22px}.grid{display:grid;gap:15px}.cards{grid-template-columns:repeat(4,1fr)}.card{background:white;border:1px solid #e4e1d8;border-radius:14px;padding:18px;box-shadow:0 2px 8px #00000008}.label{font-size:12px;color:var(--muted);font-weight:600}.metric{font-size:27px;font-weight:750;margin-top:7px}.up{font-size:12px;color:#18794e;margin-left:6px}.two{grid-template-columns:1.4fr 1fr;margin-top:16px}.section-title{font-weight:700;margin-bottom:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;padding:9px;border-bottom:1px solid var(--line)}.table td{padding:11px 9px;border-bottom:1px solid #eee}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;background:#e7f3eb;color:#16633c}.warn{background:#fff1d6;color:#8a5a00}.danger{background:#fde8e5;color:#a33}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--g);color:white;cursor:pointer;font-weight:650}.btn.alt{background:white;color:var(--g);border:1px solid var(--line)}.toolbar{display:flex;gap:9px;align-items:center;margin:12px 0 18px;flex-wrap:wrap}.toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:white}.products{grid-template-columns:repeat(3,1fr)}.prod h3{margin:8px 0 4px}.prod .price{font-size:20px;font-weight:750}.bar{height:9px;background:#eee;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--g2)}.hero{background:linear-gradient(120deg,#12382d,#2b644f);color:white;padding:26px;border-radius:16px;margin-bottom:18px}.hero h2{font-family:Georgia,serif;font-size:34px;margin:0 0 6px}.hero p{color:#dbe7e1;max-width:760px}.formrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.formrow input,.formrow select{padding:10px;border:1px solid var(--line);border-radius:9px}.hidden{display:none}.callout{padding:14px;border-radius:12px;background:#fff8e8;border:1px solid #ead8aa;margin-top:12px}.kpirow{display:flex;gap:25px;flex-wrap:wrap}.kpirow b{font-size:19px}.recipe{display:grid;grid-template-columns:1fr 1fr;gap:18px}.ingredient{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}@media(max-width:1100px){.cards,.products{grid-template-columns:repeat(2,1fr)}.two,.recipe{grid-template-columns:1fr}.formrow{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">KRAALANDS OS</div><div class="sub">Demand-to-Production Infrastructure</div><div class="nav" id="nav"></div><div class="foot">Produce against demand.<br>Source intelligently. Fulfil profitably.<br><br>Built by Tech Hub Harare</div></aside><main class="main"><div class="top"><input id="search" placeholder="Search buyers, products, outputs…"><div><b>Operations</b> &nbsp; • &nbsp; Local-first</div></div><div class="content" id="view"></div></main></div><script>
const seed={buyers:[{id:'b1',name:'Pamuonde',type:'Restaurant',location:'Nyanga',weekly:545},{id:'b2',name:'Mountain View Lodge',type:'Lodge',location:'Nyanga',weekly:480},{id:'b3',name:'City Grill Harare',type:'Restaurant',location:'Harare',weekly:350}],products:[{id:'p1',name:'Road Runner Chicken',unit:'bird',stock:120,cost:8,price:12,source:'Kraalands Selected'},{id:'p2',name:'Goat Braai Cuts',unit:'kg',stock:60,cost:6.75,price:9.5,source:'Kraalands Prepared'},{id:'p3',name:'Signature Sausage',unit:'kg',stock:80,cost:5.1,price:8,source:'Kraalands Prepared'},{id:'p4',name:'Beef Patties',unit:'pack',stock:45,cost:5.2,price:7.5,source:'Kraalands Prepared'},{id:'p5',name:'Traditional Grain Flour',unit:'kg',stock:300,cost:1.4,price:2.5,source:'Kraalands Selected'},{id:'p6',name:'Marinated Chicken',unit:'kg',stock:80,cost:4.5,price:6,source:'Kraalands Prepared'}],demands:[{buyer:'b1',product:'p2',qty:20,freq:'weekly'},{buyer:'b2',product:'p1',qty:20,freq:'weekly'},{buyer:'b3',product:'p4',qty:10,freq:'weekly'}],outputs:[{code:'KR-RR-001',product:'p1',status:'Growing',qty:275,reserved:80,date:'Jan–Feb 2027'},{code:'KR-GRN-001',product:'p5',status:'Planned',qty:800,reserved:450,date:'Apr 2027'}],suppliers:[{name:'Mbare Poultry',product:'p1',qty:200,cost:8,lead:1},{name:'Nyanga Farm',product:'p2',qty:150,cost:6,lead:2},{name:'GreenFields',product:'p5',qty:500,cost:1.2,lead:1}],orders:[{code:'ORD-0014',buyer:'b1',value:655,status:'Preparing',date:'12 Sep'},{code:'ORD-0013',buyer:'b2',value:480,status:'Packed',date:'12 Sep'},{code:'ORD-0012',buyer:'b3',value:350,status:'Out for Delivery',date:'13 Sep'}]};
let db=JSON.parse(localStorage.getItem('kraalands')||'null')||seed;const save=()=>localStorage.setItem('kraalands',JSON.stringify(db));const money=n=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});const product=id=>db.products.find(x=>x.id===id)||{};const buyer=id=>db.buyers.find(x=>x.id===id)||{};
const pages=['Dashboard','Sell','Buyers','Supply Match','Orders','Production','Output Calendar','Foods & Recipes','Backup'];let current='Dashboard';
function nav(){document.getElementById('nav').innerHTML=pages.map(x=>`<button class="${x===current?'active':''}" onclick="go('${x}')">${x}</button>`).join('')}window.go=x=>{current=x;nav();render()};
function dash(){let rev=db.orders.reduce((s,x)=>s+x.value,0),stand=db.buyers.reduce((s,x)=>s+x.weekly*4.33,0);return `<div class="title">Dashboard</div><div class="desc">Everything you need to run Kraalands Supplies, production and buyer demand.</div><div class="grid cards"><div class="card"><div class="label">Revenue MTD</div><div class="metric">${money(rev)}</div></div><div class="card"><div class="label">Standing demand / month</div><div class="metric">${money(stand)}</div></div><div class="card"><div class="label">Active buyers</div><div class="metric">${db.buyers.length}</div></div><div class="card"><div class="label">Available inventory value</div><div class="metric">${money(db.products.reduce((s,p)=>s+p.stock*p.price,0))}</div></div></div><div class="grid two"><div class="card"><div class="section-title">Orders & fulfilment</div>${orderTable()}</div><div class="card"><div class="section-title">Production expansion opportunities</div>${db.outputs.map(o=>{let annual=db.demands.filter(d=>d.product===o.product).reduce((s,d)=>s+d.qty*52,0),gap=Math.max(0,annual-o.qty);return `<div class="callout"><b>${product(o.product).name}</b><br><span class="label">Registered annual demand ${annual} • committed ${o.qty}</span><br><b>Gap: ${gap}</b></div>`}).join('')}</div></div>`}
function orderTable(){return `<table class="table"><tr><th>ORDER</th><th>BUYER</th><th>VALUE</th><th>DATE</th><th>STATUS</th></tr>${db.orders.map(o=>`<tr><td>${o.code}</td><td>${buyer(o.buyer).name}</td><td>${money(o.value)}</td><td>${o.date}</td><td><span class="badge">${o.status}</span></td></tr>`).join('')}</table>`}
function sell(){return `<div class="title">Available Now</div><div class="desc">Sell what is available today and protect margin.</div><div class="grid products">${db.products.map(p=>{let m=((p.price-p.cost)/p.price*100).toFixed(0);return `<div class="card prod"><div class="label">${p.source}</div><h3>${p.name}</h3><div class="price">$${p.price.toFixed(2)} / ${p.unit}</div><p>${p.stock} ${p.unit}s available</p><div class="bar"><i style="width:${Math.min(100,m)}%"></i></div><small>${m}% contribution margin</small><br><br><button class="btn" onclick="quickOrder('${p.id}')">Create Order</button></div>`}).join('')}</div>`}
window.quickOrder=pid=>{let b=db.buyers[0],p=product(pid),qty=prompt(`Quantity (${p.unit})?`,'10');if(!qty)return;qty=Number(qty);db.orders.unshift({code:'ORD-'+String(Date.now()).slice(-5),buyer:b.id,value:qty*p.price,status:'Confirmed',date:'Next delivery'});p.stock=Math.max(0,p.stock-qty);save();render()}
function buyers(){return `<div class="title">Buyers & Procurement</div><div class="desc">Capture what customers already buy and work backwards into supply.</div><div class="card"><div class="formrow"><input id="bn" placeholder="Buyer name"><select id="bt"><option>Restaurant</option><option>Hotel</option><option>Lodge</option><option>Retailer</option><option>Institution</option></select><input id="bl" placeholder="Location"><input id="bw" type="number" placeholder="Weekly procurement USD"></div><br><button class="btn" onclick="addBuyer()">Add Buyer</button></div><br><div class="card"><table class="table"><tr><th>BUYER</th><th>TYPE</th><th>LOCATION</th><th>WEEKLY SPEND</th><th>ANNUALISED</th></tr>${db.buyers.map(b=>`<tr><td><b>${b.name}</b></td><td>${b.type}</td><td>${b.location}</td><td>${money(b.weekly)}</td><td>${money(b.weekly*52)}</td></tr>`).join('')}</table></div>`}
window.addBuyer=()=>{let n=bn.value.trim();if(!n)return;db.buyers.push({id:'b'+Date.now(),name:n,type:bt.value,location:bl.value,weekly:Number(bw.value||0)});save();render()}
function supply(){return `<div class="title">Supply Matching</div><div class="desc">Match buyer requirements against Kraalands inventory and network supply.</div><div class="card"><div class="toolbar"><select id="sp">${db.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><input id="sq" type="number" value="50" min="1"><button class="btn" onclick="matchSupply()">Run Match</button></div><div id="match"></div></div><br><div class="card"><div class="section-title">Supplier offers</div><table class="table"><tr><th>SUPPLIER</th><th>PRODUCT</th><th>AVAILABLE</th><th>COST</th><th>LEAD</th></tr>${db.suppliers.map(s=>`<tr><td>${s.name}</td><td>${product(s.product).name}</td><td>${s.qty}</td><td>$${s.cost}</td><td>${s.lead} day(s)</td></tr>`).join('')}</table></div>`}
window.matchSupply=()=>{let pid=sp.value,need=Number(sq.value),p=product(pid),left=need,rows=[];let own=Math.min(left,p.stock);if(own){rows.push(['Kraalands inventory',own,p.cost]);left-=own}db.suppliers.filter(s=>s.product===pid).sort((a,b)=>a.cost-b.cost).forEach(s=>{if(left<=0)return;let q=Math.min(left,s.qty);rows.push([s.name,q,s.cost]);left-=q});match.innerHTML=`<h3>${p.name}: requirement ${need} ${p.unit}</h3>${rows.map(r=>`<div class="ingredient"><span>${r[0]}</span><b>${r[1]} @ $${r[2]}</b></div>`).join('')}<div class="callout"><b>${left?`Shortfall ${left} ${p.unit}`:'Fully matched'}</b></div>`}
function orders(){return `<div class="title">Orders</div><div class="desc">From confirmed demand to fulfilment and cash.</div><div class="card">${orderTable()}</div>`}
function production(){return `<div class="title">Production</div><div class="desc">Future supply starts as a production commitment, not inventory.</div>${db.outputs.map(o=>`<div class="card" style="margin-bottom:12px"><div class="kpirow"><div><span class="label">OUTPUT</span><br><b>${o.code}</b></div><div><span class="label">PRODUCT</span><br><b>${product(o.product).name}</b></div><div><span class="label">FORECAST</span><br><b>${o.qty}</b></div><div><span class="label">RESERVED</span><br><b>${o.reserved}</b></div><div><span class="label">EXPECTED</span><br><b>${o.date}</b></div></div></div>`).join('')}`}
function calendar(){return `<div class="title">Output Calendar</div><div class="desc">Know what is growing, when it will be ready and what buyers can reserve.</div><div class="hero"><h2>What's growing at Kraalands</h2><p>Future output becomes visible before harvest, so demand can shape production.</p></div><div class="grid products">${db.outputs.map(o=>`<div class="card"><span class="badge ${o.status==='Planned'?'warn':''}">${o.status}</span><h3>${product(o.product).name}</h3><p>${o.date}</p><div class="metric">${o.qty-o.reserved}</div><div class="label">forecast units still available</div></div>`).join('')}</div>`}
function foods(){let portions=300,beef=36,pasta=30;return `<div class="title">Foods & Recipes</div><div class="desc">Recipe-to-Farm: translate what people eat into ingredients, supply and production.</div><div class="recipe"><div class="card"><div class="section-title">Kraalands Beef Ragu Pasta</div><div class="ingredient"><span>Planned portions / week</span><b>${portions}</b></div><div class="ingredient"><span>Beef requirement</span><b>${beef} kg</b></div><div class="ingredient"><span>Pasta requirement</span><b>${pasta} kg</b></div><div class="ingredient"><span>Tomato/onion/herbs</span><b>Production-linked</b></div><div class="callout">A menu item becomes a production and sourcing plan.</div></div><div class="card"><div class="section-title">Recipe-to-Farm loop</div><p>Meal → Recipe → Ingredients → Available supply → Sourcing gap → Production opportunity.</p><p class="label">This is the foundation for Kraalands Foods, institutional supply and future API rails.</p></div></div>`}
function backup(){return `<div class="title">Local Data & Backup</div><div class="desc">This portable MVP stores its workspace on this Windows device.</div><div class="card"><button class="btn" onclick="exportData()">Export JSON Backup</button> <button class="btn alt" onclick="resetData()">Reset Demo Data</button><p class="label">Export regularly. The cloud/Supabase migration will replace local-only storage later.</p></div>`}
window.exportData=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='kraalands-os-backup.json';a.click()};window.resetData=()=>{if(confirm('Reset local workspace?')){localStorage.removeItem('kraalands');location.reload()}}
function render(){let map={'Dashboard':dash,'Sell':sell,'Buyers':buyers,'Supply Match':supply,'Orders':orders,'Production':production,'Output Calendar':calendar,'Foods & Recipes':foods,'Backup':backup};document.getElementById('view').innerHTML=map[current]()}nav();render();
</script></body></html>
